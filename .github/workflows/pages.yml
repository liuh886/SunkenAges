name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$({
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          })"

          if [[ "$status_code" == "404" ]]; then
            echo '::error title=GitHub Pages is not enabled::Open repository Settings → Pages → Build and deployment → Source, select GitHub Actions, save, then rerun this workflow.'
            exit 1
          fi

          if [[ "$status_code" != "200" ]]; then
            echo "::error title=Unable to read GitHub Pages settings::GitHub Pages API returned HTTP ${status_code}."
            cat "$response_file"
            exit 1
          fi

          build_type="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              print(json.load(handle).get('build_type', ''))
          PY
          )"

          if [[ "$build_type" != "workflow" ]]; then
            echo "::error title=Wrong GitHub Pages source::Current build_type is '${build_type:-unknown}'. Open Settings → Pages and select GitHub Actions as the publishing source."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production PWA
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed PWA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          site_url="${PAGE_URL%/}/"

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "$site_url" | grep --quiet '沉没纪元'

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "${site_url}manifest.webmanifest" | grep --quiet '沉没纪元'
